name: NoMachine Windows (Final Fix)

on:
  workflow_dispatch:

jobs:
  nomachine:
    runs-on: windows-latest
    steps:
      - name: Install & Connect Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-${{ github.run_id }}
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          "TAILSCALE_IP=$tsIP" | Out-File -Append $env:GITHUB_ENV

      - name: Set User Password
        shell: powershell
        run: |
          net user runneradmin "P@ssword1234"

      - name: Install NoMachine via Choco
        shell: powershell
        run: |
          choco install nomachine -y --no-progress
          
          Write-Host "Searching for nxserver.exe..."
          $paths = @(
              "C:\Program Files\NoMachine\bin\nxserver.exe",
              "C:\Program Files (x86)\NoMachine\bin\nxserver.exe"
          )
          
          $exePath = $null
          foreach ($p in $paths) {
              if (Test-Path $p) { $exePath = $p; break }
          }
          
          if ($exePath) {
              Write-Host "Found at: $exePath. Starting..."
              Start-Process $exePath -ArgumentList "--start" -WindowStyle Hidden -ErrorAction SilentlyContinue
          } else {
              Write-Host "Warning: nxserver.exe not found in standard paths."
          }
          
          Start-Sleep -Seconds 20

      - name: Open Firewall Port
        shell: powershell
        run: |
          netsh advfirewall firewall add rule name="NoMachine" dir=in action=allow protocol=TCP localport=4000

      - name: Show Connection Details & Keep Alive
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "CONNECTION DETAILS:"
          Write-Host "IP Address: $env:TAILSCALE_IP"
          Write-Host "Port: 4000"
          Write-Host "Username: runneradmin"
          Write-Host "Password: P@ssword1234"
          Write-Host "=========================================="
          while ($true) {
            Start-Sleep -Seconds 300
          }
