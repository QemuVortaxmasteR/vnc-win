name: NoMachine Windows

on:
  workflow_dispatch:

jobs:
  nomachine:
    runs-on: windows-latest
    steps:
      - name: Install & Connect Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-${{ github.run_id }}
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          "TAILSCALE_IP=$tsIP" | Out-File -Append $env:GITHUB_ENV

      - name: Set User Password
        shell: powershell
        run: |
          # ضروري جداً لأن NoMachine لا يسمح بالاتصال بحساب بدون كلمة مرور
          net user runneradmin "P@ssword1234"

      - name: Open NoMachine Firewall Port
        shell: powershell
        run: |
          netsh advfirewall firewall add rule name="NoMachine" dir=in action=allow protocol=TCP localport=4000

      - name: Download, Install & Start NoMachine
        shell: powershell
        run: |
          # استخدام curl مع إضافة مراجع لضمان التحميل الصحيح للملف
          & "C:\Windows\System32\curl.exe" -L -A "Mozilla/5.0" -o nomachine.exe "https://web9001.nomachine.com/download/9.3/Windows/nomachine_9.3.7_1_x64.exe"
          
          # التحقق من أن الملف موجود وليس فارغاً قبل البدء
          if ((Get-Item "nomachine.exe").Length -lt 10MB) { throw "Download failed or link is broken" }
          
          Write-Host "Installing NoMachine..."
          Start-Process -FilePath .\nomachine.exe -ArgumentList "/S" -Wait
          
          # انتظار بسيط لضمان استقرار الخدمات
          Start-Sleep -Seconds 15
          sc.exe start nxserver

      - name: Show Connection Details & Keep Alive
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Thanks to MR.English2008 for this work"
          Write-Host "Modified for stability"
          Write-Host "=========================================="
          Write-Host "CONNECTION DETAILS:"
          Write-Host "IP Address: $env:TAILSCALE_IP"
          Write-Host "Port: 4000"
          Write-Host "Username: runneradmin"
          Write-Host "Password: P@ssword1234"
          Write-Host "=========================================="
          while ($true) {
            Write-Host "Keep alive - $(Get-Date)"
            Start-Sleep -Seconds 300
          }
