name: NoMachine Windows (Choco Version)

on:
  workflow_dispatch:

jobs:
  nomachine:
    runs-on: windows-latest
    steps:
      - name: Install & Connect Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-${{ github.run_id }}
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          "TAILSCALE_IP=$tsIP" | Out-File -Append $env:GITHUB_ENV

      - name: Set User Password
        shell: powershell
        run: |
          net user runneradmin "P@ssword1234"

      - name: Install NoMachine via Choco
        shell: powershell
        run: |
          choco install nomachine -y --no-progress
          Import-Module "$env:ProgramData\chocolatey\helpers\chocolateyInstaller.psm1"
          Update-SessionEnvironment
          Start-Sleep -Seconds 30
          $serviceName = "nxserver"
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              sc.exe config $serviceName start= auto
              sc.exe start $serviceName
          } else {
              Start-Process "C:\Program Files (x86)\NoMachine\bin\nxserver.exe" -ArgumentList "--start" -WindowStyle Hidden
          }

      - name: Open Firewall Port
        shell: powershell
        run: |
          netsh advfirewall firewall add rule name="NoMachine" dir=in action=allow protocol=TCP localport=4000

      - name: Show Connection Details & Keep Alive
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "CONNECTION DETAILS:"
          Write-Host "IP Address: $env:TAILSCALE_IP"
          Write-Host "Port: 4000"
          Write-Host "Username: runneradmin"
          Write-Host "Password: P@ssword1234"
          Write-Host "=========================================="
          while ($true) {
            Start-Sleep -Seconds 300
          }
